[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-platform-backend"
version = "0.1.0"
description = "Generic Enterprise AI Knowledge Platform Core Backend"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    ".",
    ".venv/Lib/site-packages"
]
