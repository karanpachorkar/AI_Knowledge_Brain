services:
  # Frontend Service (Next.js)

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: enterprise_ai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - enterprise_ai_network

  # Backend API Service (FastAPI)
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: enterprise_ai_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"

    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://app_user:app_password@postgres:5432/enterprise_ai_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENSEARCH_URL=http://opensearch:9200
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHAT_MODEL=qwen2.5:3b
      - EMBEDDING_MODEL=bge-m3
    volumes:

      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - storage_data:/app/.storage_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - enterprise_ai_network

  # Async Background Worker Service
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: enterprise_ai_worker
    restart: unless-stopped
    command: python -m app.workers.main
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://app_user:app_password@postgres:5432/enterprise_ai_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENSEARCH_URL=http://opensearch:9200
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHAT_MODEL=qwen2.5:3b
      - EMBEDDING_MODEL=bge-m3
    volumes:

      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - storage_data:/app/.storage_data

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - enterprise_ai_network

  # System of Record Database (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: enterprise_ai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d enterprise_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_ai_network

  # Cache and Message Broker (Redis)
  redis:
    image: redis:7-alpine
    container_name: enterprise_ai_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_ai_network

  # Vector Database (Qdrant)
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: enterprise_ai_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_ai_network

  # Keyword Search Engine (OpenSearch)
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: enterprise_ai_opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_ai_network

  # Object Storage (MinIO)
  minio:
    image: elestio/minio:latest
    container_name: enterprise_ai_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"


    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_ai_network

  # Local AI Model Server (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: enterprise_ai_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_ai_network

networks:
  enterprise_ai_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  opensearch_data:
  minio_data:
  ollama_data:
  storage_data:
