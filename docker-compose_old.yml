    container_name: enterprise_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: enterprise_ai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d enterprise_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_ai_network

  # Cache and Message Broker (Redis)
  redis:
    image: redis:7-alpine
    container_name: enterprise_ai_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_ai_network

  # Vector Database (Qdrant)
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: enterprise_ai_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    # Disabled because this image does not contain wget.
    # Qdrant readiness was verified separately through /readyz.
    healthcheck:
      disable: true
    networks:
      - enterprise_ai_network

  # Keyword Search Engine (OpenSearch)
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: enterprise_ai_opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_ai_network

  # Object Storage (MinIO)
  minio:
    image: elestio/minio:latest
    container_name: enterprise_ai_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_ai_network

  # Local AI Model Server (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: enterprise_ai_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - enterprise_ai_network

networks:
  enterprise_ai_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  opensearch_data:
  minio_data:
  ollama_data:
  storage_data:
